<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>แผงควบคุมเว็บไซต์ · น่วม Thai Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF6EE;
    --surface: #FFFDF9;
    --surface-2: #F1E7D6;
    --ink: #34281C;
    --ink-soft: #6E5D49;
    --ink-faint: #93826C;
    --accent: #B5603C;
    --accent-hover: #9C4F30;
    --accent-ink: #FFF7EF;
    --line: #E7DAC4;
    --line-strong: #D8C6A6;
    --good: #1E8E3E;
    --bad: #C5221F;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans Thai", system-ui, sans-serif;
    line-height: 1.5;
    padding-bottom: 80px;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-family: "Noto Serif Thai", serif;
    font-size: 19px;
    margin: 0;
  }
  header a {
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }

  .tabnav {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: var(--header-h, 61px);
    z-index: 9;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabnav::-webkit-scrollbar { display: none; }
  .tabnav-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 0 16px;
  }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 13px 12px 11px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-badge {
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .tab-btn:not(.active) .tab-badge { background: var(--line-strong); color: var(--ink-soft); }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .tab-panel { display: none; flex-direction: column; gap: 24px; }
  .tab-panel.active { display: flex; }
  section.panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  section.panel h2 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  section.panel .desc {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 16px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 600;
  }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .switch-line { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .switch {
    position: relative; width: 42px; height: 24px; flex: none;
  }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; background: var(--line-strong); border-radius: 999px; transition: background 0.15s;
  }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%;
    transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }

  .price-group {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    background: var(--surface-2);
  }
  .price-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: var(--bad); border: 1px solid #E7B7B4; }
  .btn-danger:hover { background: #FCEDEC; }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .item-actions, .group-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .gallery-grid-admin {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }
  .photo-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
  }
  .photo-card img {
    width: 100%; height: 130px; object-fit: cover; display: block; background: #ddd;
  }
  .photo-card .body { padding: 10px; }
  .photo-card .field { margin-bottom: 8px; }
  .photo-card .field label { font-size: 11px; }
  .upload-new {
    border: 2px dashed var(--line-strong);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    text-align: center;
    padding: 16px;
  }
  .upload-new:hover { border-color: var(--accent); color: var(--accent); }

  .savebar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 20;
  }
  .status-msg { font-size: 13px; font-weight: 600; }
  .status-msg.ok { color: var(--good); }
  .status-msg.err { color: var(--bad); }
  .hint { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }
  .loading { text-align: center; padding: 60px 0; color: var(--ink-soft); }

  /* stats dashboard */
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-card .label { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
  .stat-card .value { font-size: 26px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat-card .delta { font-size: 12px; margin-top: 3px; font-weight: 600; }
  .stat-card .delta.up { color: var(--good); }
  .stat-card .delta.down { color: var(--bad); }
  .stat-card .delta.flat { color: var(--ink-faint); }

  .chart-wrap { margin-bottom: 20px; }
  .chart-wrap h3 { font-size: 13.5px; margin: 0 0 10px; color: var(--ink-soft); }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 120px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .bar-chart .bar {
    flex: 1 1 0;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    position: relative;
  }
  .bar-chart .bar:hover { background: var(--accent-hover); }
  .bar-chart .bar[data-empty="1"] { background: var(--line-strong); }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  table.stats-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.stats-table th, table.stats-table td {
    text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  table.stats-table th:first-child, table.stats-table td:first-child { text-align: left; }
  table.stats-table th { color: var(--ink-soft); font-size: 12px; font-weight: 600; }

  /* bookings */
  .table-scroll { overflow-x: auto; }
  table.bookings-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
  table.bookings-table th, table.bookings-table td {
    text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
  }
  table.bookings-table th { color: var(--ink-soft); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  table.bookings-table td.notes-cell { max-width: 220px; color: var(--ink-soft); font-size: 12.5px; }
  table.bookings-table tr.contacted td { opacity: 0.5; }
  .contacted-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .empty-note { color: var(--ink-faint); font-size: 13.5px; padding: 8px 0; }
  .email-hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>แผงควบคุมเว็บไซต์ · น่วม Thai Massage</h1>
  <a href="/" target="_blank" rel="noopener">ดูหน้าเว็บไซต์ →</a>
</header>

<nav class="tabnav" id="tabnav" style="display:none;">
  <div class="tabnav-inner" id="tabnavInner"></div>
</nav>

<main id="app">
  <div class="loading">กำลังโหลดข้อมูล...</div>
</main>

<div class="savebar" id="savebar" style="display:none;">
  <button class="btn btn-accent" id="saveBtn">บันทึกการเปลี่ยนแปลง</button>
  <span class="status-msg" id="statusMsg"></span>
</div>

<script>
(function () {
  var content = null;
  var stats = null;
  var bookings = null;
  var activeTab = null;
  var THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

  // stats are bucketed in Asia/Bangkok time server-side; mirror that here
  // so "this month" / "today" match what the server recorded
  function bangkokNow() {
    var d = new Date();
    var utcMs = d.getTime() + d.getTimezoneOffset() * 60000;
    return new Date(utcMs + 7 * 3600000);
  }
  function fmtDateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmtMonthKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function monthLabel(monthKey) {
    var parts = monthKey.split("-");
    var mi = parseInt(parts[1], 10) - 1;
    return THAI_MONTHS[mi] + " " + parts[0];
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function field(labelText, inputEl) {
    var wrap = el("div", { class: "field" });
    wrap.appendChild(el("label", {}, [document.createTextNode(labelText)]));
    wrap.appendChild(inputEl);
    return wrap;
  }

  function textInput(value) {
    var i = el("input", { type: "text" });
    i.value = value || "";
    return i;
  }

  function numberInput(value) {
    var i = el("input", { type: "number" });
    i.value = value != null ? value : "";
    return i;
  }

  function setStatus(text, kind) {
    var s = document.getElementById("statusMsg");
    s.textContent = text;
    s.className = "status-msg " + (kind || "");
    if (text) {
      setTimeout(function () { if (s.textContent === text) s.textContent = ""; }, 4000);
    }
  }

  function renderStatsSection(statsData) {
    var days = statsData.days || {};
    var now = bangkokNow();
    var thisMonthKey = fmtMonthKey(now);
    var lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    var lastMonthKey = fmtMonthKey(lastMonthDate);

    function monthTotals(monthKey) {
      var totals = { pageviews: 0, calls: 0, directions: 0 };
      Object.keys(days).forEach(function (dateKey) {
        if (dateKey.indexOf(monthKey) === 0) {
          totals.pageviews += days[dateKey].pageviews || 0;
          totals.calls += days[dateKey].calls || 0;
          totals.directions += days[dateKey].directions || 0;
        }
      });
      return totals;
    }

    var thisMonth = monthTotals(thisMonthKey);
    var lastMonth = monthTotals(lastMonthKey);
    var hasLastMonthData = Object.keys(days).some(function (k) { return k.indexOf(lastMonthKey) === 0; });

    function deltaEl(current, previous, hasPrev) {
      var span = el("span", { class: "delta" });
      if (!hasPrev) {
        span.classList.add("flat");
        span.textContent = "ไม่มีข้อมูลเดือนก่อนเทียบ";
        return span;
      }
      if (previous === 0) {
        if (current === 0) {
          span.classList.add("flat");
          span.textContent = "เท่าเดือนที่แล้ว";
        } else {
          span.classList.add("up");
          span.textContent = "เพิ่มขึ้นจาก 0";
        }
        return span;
      }
      var pct = Math.round(((current - previous) / previous) * 100);
      if (pct > 0) {
        span.classList.add("up");
        span.textContent = "▲ " + pct + "% จากเดือนที่แล้ว";
      } else if (pct < 0) {
        span.classList.add("down");
        span.textContent = "▼ " + Math.abs(pct) + "% จากเดือนที่แล้ว";
      } else {
        span.classList.add("flat");
        span.textContent = "เท่าเดือนที่แล้ว";
      }
      return span;
    }

    function statCard(label, value, delta) {
      var card = el("div", { class: "stat-card" });
      card.appendChild(el("div", { class: "label" }, [document.createTextNode(label)]));
      card.appendChild(el("div", { class: "value" }, [document.createTextNode(String(value))]));
      card.appendChild(delta);
      return card;
    }

    var sec = el("section", { class: "panel" });
    sec.appendChild(el("h2", {}, [document.createTextNode("สถิติการเข้าชม")]));
    sec.appendChild(el("p", { class: "desc" }, [document.createTextNode("ข้อมูลเดือน " + monthLabel(thisMonthKey))]));

    var cards = el("div", { class: "stat-cards" }, [
      statCard("คนเข้าเว็บ", thisMonth.pageviews, deltaEl(thisMonth.pageviews, lastMonth.pageviews, hasLastMonthData)),
      statCard("กดโทร", thisMonth.calls, deltaEl(thisMonth.calls, lastMonth.calls, hasLastMonthData)),
      statCard("กดนำทาง", thisMonth.directions, deltaEl(thisMonth.directions, lastMonth.directions, hasLastMonthData)),
    ]);
    sec.appendChild(cards);

    // last 30 days bar chart (pageviews)
    var chartWrap = el("div", { class: "chart-wrap" });
    chartWrap.appendChild(el("h3", {}, [document.createTextNode("คนเข้าเว็บย้อนหลัง 30 วัน")]));
    var last30 = [];
    for (var i = 29; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var key = fmtDateKey(d);
      last30.push({ key: key, value: (days[key] && days[key].pageviews) || 0 });
    }
    var maxVal = last30.reduce(function (m, x) { return Math.max(m, x.value); }, 0);
    var barChart = el("div", { class: "bar-chart" });
    last30.forEach(function (pt) {
      var h = maxVal > 0 ? Math.max(2, Math.round((pt.value / maxVal) * 118)) : 2;
      var bar = el("div", { class: "bar", title: pt.key + ": " + pt.value + " ครั้ง", style: "height:" + h + "px;" });
      if (pt.value === 0) bar.setAttribute("data-empty", "1");
      barChart.appendChild(bar);
    });
    chartWrap.appendChild(barChart);
    var labels = el("div", { class: "bar-labels" }, [
      el("span", {}, [document.createTextNode(last30[0].key.slice(5))]),
      el("span", {}, [document.createTextNode(last30[last30.length - 1].key.slice(5))]),
    ]);
    chartWrap.appendChild(labels);
    sec.appendChild(chartWrap);

    // last 6 months table
    var monthKeys = [];
    for (var mo = 5; mo >= 0; mo--) {
      var md = new Date(now.getFullYear(), now.getMonth() - mo, 1);
      monthKeys.push(fmtMonthKey(md));
    }
    var table = el("table", { class: "stats-table" });
    var thead = el("thead", {}, [el("tr", {}, [
      el("th", {}, [document.createTextNode("เดือน")]),
      el("th", {}, [document.createTextNode("เข้าชม")]),
      el("th", {}, [document.createTextNode("กดโทร")]),
      el("th", {}, [document.createTextNode("กดนำทาง")]),
    ])]);
    var tbody = el("tbody");
    monthKeys.forEach(function (mk) {
      var t = monthTotals(mk);
      tbody.appendChild(el("tr", {}, [
        el("td", {}, [document.createTextNode(monthLabel(mk))]),
        el("td", {}, [document.createTextNode(String(t.pageviews))]),
        el("td", {}, [document.createTextNode(String(t.calls))]),
        el("td", {}, [document.createTextNode(String(t.directions))]),
      ]));
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    sec.appendChild(table);

    return sec;
  }

  function renderBookingsSection(bookingsData, currentContent) {
    var sec = el("section", { class: "panel" });
    sec.appendChild(el("h2", {}, [document.createTextNode("คำขอจองคิว")]));
    sec.appendChild(el("p", { class: "desc" }, [document.createTextNode("รายการคำขอจองคิวจากลูกค้า — ระบบไม่ส่งอีเมลแจ้งเตือน กรุณาเข้ามาดูที่แท็บนี้เป็นระยะเพื่อไม่ให้พลาดคำขอใหม่")]));

    var items = (bookingsData && bookingsData.items) || [];
    if (!items.length) {
      sec.appendChild(el("p", { class: "empty-note" }, [document.createTextNode("ยังไม่มีคำขอจองคิว")]));
    } else {
      var wrap = el("div", { class: "table-scroll" });
      var table = el("table", { class: "bookings-table" });
      var headLabels = ["ส่งเมื่อ", "ชื่อ", "เบอร์โทร", "วันที่นัด", "เวลา", "บริการ", "หมายเหตุ", "ติดต่อแล้ว", ""];
      var thead = el("thead", {}, [el("tr", {}, headLabels.map(function (t) {
        return el("th", {}, [document.createTextNode(t)]);
      }))]);
      var tbody = el("tbody");
      items.forEach(function (b) {
        var row = el("tr", { class: b.contacted ? "contacted" : "" });
        var created = new Date(b.createdAt);
        var createdStr = isNaN(created.getTime())
          ? "-"
          : created.toLocaleString("th-TH", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });

        var bookedDate = b.date ? new Date(b.date + "T00:00:00") : null;
        var bookedDateStr = bookedDate && !isNaN(bookedDate.getTime())
          ? bookedDate.toLocaleDateString("th-TH", { day: "2-digit", month: "2-digit", year: "2-digit" })
          : (b.date || "-");

        row.appendChild(el("td", {}, [document.createTextNode(createdStr)]));
        row.appendChild(el("td", {}, [document.createTextNode(b.name || "")]));
        row.appendChild(el("td", {}, [document.createTextNode(b.phone || "")]));
        row.appendChild(el("td", {}, [document.createTextNode(bookedDateStr)]));
        row.appendChild(el("td", {}, [document.createTextNode(b.time || "")]));
        row.appendChild(el("td", {}, [document.createTextNode(b.service || "-")]));
        row.appendChild(el("td", { class: "notes-cell" }, [document.createTextNode(b.notes || "-")]));

        var toggleWrap = el("label", { class: "contacted-toggle" });
        var cb = el("input", { type: "checkbox" });
        cb.checked = !!b.contacted;
        cb.addEventListener("change", function () {
          cb.disabled = true;
          fetch("/api/bookings/" + b.id + "/contacted", { method: "POST", credentials: "same-origin" })
            .then(function (r) { if (!r.ok) throw new Error("failed"); return r.json(); })
            .then(function (data) {
              b.contacted = data.contacted;
              row.className = b.contacted ? "contacted" : "";
              setStatus(b.contacted ? "ทำเครื่องหมายว่าติดต่อแล้ว" : "ยกเลิกเครื่องหมายติดต่อแล้ว", "ok");
            })
            .catch(function () {
              cb.checked = !cb.checked;
              setStatus("อัปเดตไม่สำเร็จ", "err");
            })
            .finally(function () { cb.disabled = false; });
        });
        toggleWrap.appendChild(cb);
        toggleWrap.appendChild(document.createTextNode("ติดต่อแล้ว"));
        row.appendChild(el("td", {}, [toggleWrap]));

        var delBtn = el("button", { class: "btn btn-danger btn-sm", type: "button" }, [document.createTextNode("ลบ")]);
        delBtn.addEventListener("click", function () {
          if (!confirm("ลบคำขอจองคิวนี้? การลบไม่สามารถย้อนกลับได้")) return;
          delBtn.disabled = true;
          fetch("/api/bookings/" + b.id + "/delete", { method: "POST", credentials: "same-origin" })
            .then(function (r) { if (!r.ok) throw new Error("failed"); return r.json(); })
            .then(function () {
              var i = items.indexOf(b);
              if (i > -1) items.splice(i, 1);
              setStatus("ลบคำขอจองคิวแล้ว", "ok");
              render();
            })
            .catch(function () {
              delBtn.disabled = false;
              setStatus("ลบไม่สำเร็จ ลองใหม่อีกครั้ง", "err");
            });
        });
        row.appendChild(el("td", {}, [delBtn]));

        tbody.appendChild(row);
      });
      table.appendChild(thead);
      table.appendChild(tbody);
      wrap.appendChild(table);
      sec.appendChild(wrap);
    }

    return { section: sec };
  }

  function countUncontacted() {
    var items = (bookings && bookings.items) || [];
    return items.filter(function (b) { return !b.contacted; }).length;
  }

  function applyActiveTab() {
    var panels = document.querySelectorAll(".tab-panel");
    panels.forEach(function (p) {
      p.classList.toggle("active", p.getAttribute("data-tab") === activeTab);
    });
    var btns = document.querySelectorAll(".tab-btn");
    btns.forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === activeTab);
    });
  }

  function switchTab(id) {
    activeTab = id;
    applyActiveTab();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function buildTabNav(tabDefs) {
    var inner = document.getElementById("tabnavInner");
    inner.innerHTML = "";
    tabDefs.forEach(function (t) {
      var btn = el("button", { class: "tab-btn", type: "button", "data-tab": t.id });
      btn.appendChild(document.createTextNode(t.label));
      if (t.badge) {
        btn.appendChild(el("span", { class: "tab-badge" }, [document.createTextNode(String(t.badge))]));
      }
      btn.addEventListener("click", function () { switchTab(t.id); });
      inner.appendChild(btn);
    });
    document.getElementById("tabnav").style.display = "block";
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var tabDefs = [];

    // ---- stats ----
    if (stats) {
      app.appendChild(el("div", { class: "tab-panel", "data-tab": "stats" }, [renderStatsSection(stats)]));
      tabDefs.push({ id: "stats", label: "สถิติ" });
    }

    // ---- bookings ----
    var bookingsResult = renderBookingsSection(bookings, content);
    app.appendChild(el("div", { class: "tab-panel", "data-tab": "bookings" }, [bookingsResult.section]));
    tabDefs.push({ id: "bookings", label: "คำขอจองคิว", badge: countUncontacted() });

    // ---- promo ----
    var promoSec = el("section", { class: "panel" });
    promoSec.appendChild(el("h2", {}, [document.createTextNode("โปรโมชัน")]));
    promoSec.appendChild(el("p", { class: "desc" }, [document.createTextNode("ป้ายโปรโมชันจะแสดงด้านบนหน้าเว็บไซต์เมื่อเปิดใช้งาน")]));

    var switchLine = el("div", { class: "switch-line" });
    var switchLabel = el("label", { class: "switch", style: "margin:0;" });
    switchLabel.removeAttribute("style");
    var promoToggle = el("input", { type: "checkbox" });
    promoToggle.checked = !!content.promo.enabled;
    switchLabel.appendChild(promoToggle);
    switchLabel.appendChild(el("span", { class: "track" }));
    switchLabel.appendChild(el("span", { class: "thumb" }));
    switchLine.appendChild(switchLabel);
    switchLine.appendChild(el("span", {}, [document.createTextNode("เปิดใช้งานป้ายโปรโมชัน")]));
    promoSec.appendChild(switchLine);

    var promoTh = textInput(content.promo.th);
    var promoEn = textInput(content.promo.en);
    var promoNoteTh = textInput(content.promo.note_th);
    var promoNoteEn = textInput(content.promo.note_en);
    var promoRow = el("div", { class: "row2" }, [
      field("ข้อความโปรโมชัน (ไทย)", promoTh),
      field("Promotion text (English)", promoEn),
    ]);
    var promoNoteRow = el("div", { class: "row2" }, [
      field("เงื่อนไข (ไทย)", promoNoteTh),
      field("Terms note (English)", promoNoteEn),
    ]);
    promoSec.appendChild(promoRow);
    promoSec.appendChild(promoNoteRow);
    app.appendChild(el("div", { class: "tab-panel", "data-tab": "promo" }, [promoSec]));
    tabDefs.push({ id: "promo", label: "โปรโมชัน" });

    // ---- prices ----
    var priceSec = el("section", { class: "panel" });
    priceSec.appendChild(el("h2", {}, [document.createTextNode("บริการ & ราคา")]));
    priceSec.appendChild(el("p", { class: "desc" }, [document.createTextNode("แก้ไขชื่อรายการและราคาตามรอบเวลา (บาท)")]));

    var groupsWrap = el("div", { id: "groupsWrap" });
    content.priceGroups.forEach(function (group) {
      groupsWrap.appendChild(renderPriceGroup(group));
    });
    priceSec.appendChild(groupsWrap);

    var addGroupBtn = el("button", { class: "btn btn-ghost", type: "button" }, [document.createTextNode("+ เพิ่มหมวดหมู่ใหม่")]);
    addGroupBtn.addEventListener("click", function () {
      var newGroup = { title_th: "หมวดหมู่ใหม่", title_en: "New category", items: [] };
      content.priceGroups.push(newGroup);
      groupsWrap.appendChild(renderPriceGroup(newGroup));
    });
    priceSec.appendChild(addGroupBtn);

    var noteTh = textInput(content.priceNote.th);
    var noteEn = textInput(content.priceNote.en);
    priceSec.appendChild(el("div", { class: "row2", style: "margin-top:14px;" }, [
      field("หมายเหตุราคา (ไทย)", noteTh),
      field("Price note (English)", noteEn),
    ]));
    app.appendChild(el("div", { class: "tab-panel", "data-tab": "prices" }, [priceSec]));
    tabDefs.push({ id: "prices", label: "ราคา & บริการ" });

    // ---- gallery ----
    var gallerySec = el("section", { class: "panel" });
    gallerySec.appendChild(el("h2", {}, [document.createTextNode("รูปภาพแกลเลอรี")]));
    gallerySec.appendChild(el("p", { class: "desc" }, [document.createTextNode("อัปโหลดรูปใหม่จะบันทึกทันที ส่วนคำบรรยายให้กด \"บันทึกการเปลี่ยนแปลง\" ด้านล่าง")]));
    var grid = el("div", { class: "gallery-grid-admin", id: "galleryGridAdmin" });
    content.gallery.forEach(function (photo, idx) {
      grid.appendChild(renderPhotoCard(photo, idx));
    });
    grid.appendChild(renderUploadNewCard());
    gallerySec.appendChild(grid);
    app.appendChild(el("div", { class: "tab-panel", "data-tab": "gallery" }, [gallerySec]));
    tabDefs.push({ id: "gallery", label: "แกลเลอรี" });

    // collect functions for save
    window.__collect = function () {
      content.promo.enabled = promoToggle.checked;
      content.promo.th = promoTh.value;
      content.promo.en = promoEn.value;
      content.promo.note_th = promoNoteTh.value;
      content.promo.note_en = promoNoteEn.value;
      content.priceNote.th = noteTh.value;
      content.priceNote.en = noteEn.value;
      return content;
    };

    buildTabNav(tabDefs);
    if (!activeTab || !tabDefs.some(function (t) { return t.id === activeTab; })) {
      activeTab = tabDefs[0].id;
    }
    applyActiveTab();

    document.getElementById("savebar").style.display = "flex";
  }

  function renderPriceGroup(group) {
    var box = el("div", { class: "price-group" });
    var titleTh = textInput(group.title_th);
    var titleEn = textInput(group.title_en);
    titleTh.addEventListener("input", function () { group.title_th = titleTh.value; });
    titleEn.addEventListener("input", function () { group.title_en = titleEn.value; });
    box.appendChild(el("div", { class: "row2" }, [
      field("ชื่อหมวดหมู่ (ไทย)", titleTh),
      field("Category name (English)", titleEn),
    ]));

    var itemsWrap = el("div");
    group.items.forEach(function (item) {
      itemsWrap.appendChild(renderPriceItem(group, item, itemsWrap));
    });
    box.appendChild(itemsWrap);

    var actions = el("div", { class: "group-actions" });
    var addItemBtn = el("button", { class: "btn btn-ghost btn-sm", type: "button" }, [document.createTextNode("+ เพิ่มรายการ")]);
    addItemBtn.addEventListener("click", function () {
      var newItem = { name_th: "รายการใหม่", name_en: "New item", p60: 0, p90: 0, p120: 0 };
      group.items.push(newItem);
      itemsWrap.appendChild(renderPriceItem(group, newItem, itemsWrap));
    });
    var removeGroupBtn = el("button", { class: "btn btn-danger btn-sm", type: "button" }, [document.createTextNode("ลบหมวดหมู่นี้")]);
    removeGroupBtn.addEventListener("click", function () {
      if (!confirm("ลบหมวดหมู่นี้ทั้งหมด?")) return;
      var i = content.priceGroups.indexOf(group);
      if (i > -1) content.priceGroups.splice(i, 1);
      box.remove();
    });
    actions.appendChild(addItemBtn);
    actions.appendChild(removeGroupBtn);
    box.appendChild(actions);

    return box;
  }

  function renderPriceItem(group, item, itemsWrap) {
    var card = el("div", { class: "price-item" });
    var nameTh = textInput(item.name_th);
    var nameEn = textInput(item.name_en);
    var p60 = numberInput(item.p60);
    var p90 = numberInput(item.p90);
    var p120 = numberInput(item.p120);
    nameTh.addEventListener("input", function () { item.name_th = nameTh.value; });
    nameEn.addEventListener("input", function () { item.name_en = nameEn.value; });
    p60.addEventListener("input", function () { item.p60 = parseInt(p60.value, 10) || 0; });
    p90.addEventListener("input", function () { item.p90 = parseInt(p90.value, 10) || 0; });
    p120.addEventListener("input", function () { item.p120 = parseInt(p120.value, 10) || 0; });

    card.appendChild(el("div", { class: "row2" }, [
      field("ชื่อรายการ (ไทย)", nameTh),
      field("Item name (English)", nameEn),
    ]));
    card.appendChild(el("div", { class: "row3" }, [
      field("ราคา 60 นาที", p60),
      field("ราคา 90 นาที", p90),
      field("ราคา 120 นาที", p120),
    ]));
    var removeBtn = el("button", { class: "btn btn-danger btn-sm", type: "button" }, [document.createTextNode("ลบรายการนี้")]);
    removeBtn.addEventListener("click", function () {
      var i = group.items.indexOf(item);
      if (i > -1) group.items.splice(i, 1);
      card.remove();
    });
    card.appendChild(el("div", { class: "item-actions" }, [removeBtn]));
    return card;
  }

  function renderPhotoCard(photo, idx) {
    var card = el("div", { class: "photo-card" });
    var img = el("img", { src: "/uploads/" + photo.file, alt: "" });
    card.appendChild(img);
    var body = el("div", { class: "body" });

    var capTh = textInput(photo.caption_th);
    var capEn = textInput(photo.caption_en);
    capTh.addEventListener("input", function () { photo.caption_th = capTh.value; });
    capEn.addEventListener("input", function () { photo.caption_en = capEn.value; });
    body.appendChild(field("คำบรรยาย (ไทย)", capTh));
    body.appendChild(field("Caption (English)", capEn));

    var fileInput = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp", style: "font-size:12px;width:100%;" });
    fileInput.addEventListener("change", function () {
      if (!fileInput.files[0]) return;
      uploadPhoto(fileInput.files[0], idx, img);
    });
    body.appendChild(field("เปลี่ยนรูปนี้", fileInput));

    var delBtn = el("button", { class: "btn btn-danger btn-sm", type: "button" }, [document.createTextNode("ลบรูปนี้")]);
    delBtn.addEventListener("click", function () {
      if (!confirm("ลบรูปนี้ออกจากแกลเลอรี?")) return;
      deletePhoto(idx, card);
    });
    body.appendChild(delBtn);

    card.appendChild(body);
    return card;
  }

  function renderUploadNewCard() {
    var wrap = el("div", { class: "photo-card" });
    var box = el("div", { class: "upload-new" }, [document.createTextNode("+ เพิ่มรูปใหม่\n(คลิกเพื่อเลือกไฟล์)")]);
    var fileInput = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp", style: "display:none;" });
    box.addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      if (!fileInput.files[0]) return;
      uploadPhoto(fileInput.files[0], null, null);
    });
    wrap.appendChild(box);
    wrap.appendChild(fileInput);
    return wrap;
  }

  function uploadPhoto(file, index, imgElToUpdate) {
    var fd = new FormData();
    fd.append("image", file);
    if (index !== null && index !== undefined) fd.append("index", index);
    setStatus("กำลังอัปโหลดรูป...", "");
    fetch("/api/upload/gallery", { method: "POST", body: fd, credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error("upload failed"); return r.json(); })
      .then(function (data) {
        content = data.content;
        setStatus("อัปโหลดรูปสำเร็จ", "ok");
        render();
      })
      .catch(function () { setStatus("อัปโหลดรูปไม่สำเร็จ", "err"); });
  }

  function deletePhoto(index, cardEl) {
    setStatus("กำลังลบรูป...", "");
    fetch("/api/gallery/" + index + "/delete", { method: "POST", credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error("delete failed"); return r.json(); })
      .then(function (data) {
        content = data.content;
        setStatus("ลบรูปสำเร็จ", "ok");
        render();
      })
      .catch(function () { setStatus("ลบรูปไม่สำเร็จ", "err"); });
  }

  function saveContent() {
    var payload = window.__collect();
    setStatus("กำลังบันทึก...", "");
    fetch("/api/content", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(payload),
    })
      .then(function (r) { if (!r.ok) throw new Error("save failed"); return r.json(); })
      .then(function () { setStatus("บันทึกเรียบร้อยแล้ว ✓", "ok"); })
      .catch(function () { setStatus("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง", "err"); });
  }

  document.getElementById("saveBtn").addEventListener("click", saveContent);

  // keep the tab bar pinned right under the header, whatever its actual
  // rendered height is (it can wrap to two lines on narrow screens)
  function syncHeaderHeight() {
    var header = document.querySelector("header");
    if (header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }
  syncHeaderHeight();
  window.addEventListener("resize", syncHeaderHeight);

  fetch("/api/stats", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      stats = data;
      if (content) render();
    })
    .catch(function () { /* non-fatal: stats panel just won't show */ });

  fetch("/api/bookings", { credentials: "same-origin" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      bookings = data;
      if (content) render();
    })
    .catch(function () { /* non-fatal: bookings list just won't show */ });

  fetch("/api/content", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      content = data;
      render();
    })
    .catch(function () {
      document.getElementById("app").innerHTML = "<div class=\"loading\">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้า</div>";
    });
})();
</script>
</body>
</html>
